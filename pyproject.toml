[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.11"
dependencies = [
    annotated-types==0.8.0
    langchain==1.4.2
    langgraph==1.2.12
    pydantic==2.13.5
    python-dotenv==1.2.3
]

[tool.setuptools.packages.find]
where = ['src']